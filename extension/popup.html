<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; width: 320px; background: #12141a; color: #eef0f5; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .wrap { padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  h1 { font-size: 16px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #e5484d; }
  .dot.on { background: #22c39a; } .dot.wait { background: #f5a524; }
  label { font-size: 12px; color: #a3abbb; margin-top: 2px; }
  input[type=text], input[type=password], input:not([type]) { width: 100%; box-sizing: border-box; padding: 8px 10px; border-radius: 8px; border: 1px solid #3a4050; background: #0f1218; color: #eef0f5; font: inherit; }
  .check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #cfd4de; }
  button { padding: 9px; border: 0; border-radius: 8px; background: #7c5cff; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button.off { background: #3a4050; }
  .status { font-size: 12px; color: #a3abbb; min-height: 16px; }
  .err { color: #ff8080; }
  ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  li { background: #1c2029; border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  li small { display: block; color: #a3abbb; }
  a { color: #22c39a; }
  hr { border: 0; border-top: 1px solid #2c313d; width: 100%; margin: 4px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="dot" id="dot"></span> Ortak İzle</h1>
  <div class="status" id="status"></div>

  <label for="serverUrl">Sunucu adresi (tabletin adresi)</label>
  <input id="serverUrl" placeholder="ör. 192.168.1.20:8787">
  <label for="name">Adın</label>
  <input id="name" maxlength="30" placeholder="ör. Berkay">
  <label for="room">Oda adı (ikiniz de aynısını yazın)</label>
  <input id="room" maxlength="40" placeholder="salon">
  <label for="password">Şifre (sunucuda ayarlıysa)</label>
  <input id="password" type="password" placeholder="boş bırakabilirsin">
  <label class="check"><input type="checkbox" id="autoFollow"> Diğeri bir şey açınca beni de otomatik götür</label>
  <button id="toggle">Bağlan</button>

  <div id="roomBox" hidden>
    <hr>
    <div style="font-weight:600;margin-bottom:6px">Odadakiler</div>
    <ul id="members"></ul>
  </div>
</div>
<script src="popup.js"></script>
</body>
</html>
